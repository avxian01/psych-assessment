let currentQuestion = 0;
let score = 0;
let streak = 0;
let isMuted = false;
let quizData = [];
let currentNotes = "";
let wrongQuestions = [];
let bookmarkedQuestions = [];
let userAnswers = {};
let categoryStats = {};
let currentReviewMode = 'answers';

let currentFontSize = "100%";
let currentFontFamily = "'Poppins', sans-serif";

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function populateCategories() {
    const categorySelect = document.getElementById("categorySelect");
    const categories = ["All", ...new Set(questions.map(q => q.category).filter(Boolean))];
    
    categorySelect.innerHTML = "";
    categories.forEach(cat => {
        let opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat === "All" ? "All Categories" : cat;
        categorySelect.appendChild(opt);
    });
}

populateCategories();
loadSettings();
checkSavedProgress();

function openSettingsModal() {
    document.getElementById("settingsModal").classList.remove("hidden");
}

function closeSettingsModal() {
    document.getElementById("settingsModal").classList.add("hidden");
}

function changeFontSize(size) {
    currentFontSize = size;
    document.documentElement.style.setProperty('--base-font-scale', size);
    saveSettings();
}

function changeFontFamily(family) {
    currentFontFamily = family;
    document.documentElement.style.setProperty('--app-font', family);
    saveSettings();
}

function toggleSound() {
    isMuted = !isMuted;
    updateSoundUI();
    saveSettings();
}

function updateSoundUI() {
    const statusText = document.getElementById("soundStatusText");
    if(statusText) {
        statusText.textContent = isMuted ? "OFF 🔇" : "ON 🔊";
    }
}

function saveSettings() {
    const settings = {
        fontSize: currentFontSize,
        fontFamily: currentFontFamily,
        isMuted: isMuted
    };
    localStorage.setItem("quizSettings", JSON.stringify(settings));
}

function loadSettings() {
    const saved = localStorage.getItem("quizSettings");
    if (saved) {
        const settings = JSON.parse(saved);
        if (settings.fontSize) {
            currentFontSize = settings.fontSize;
            document.getElementById("fontSizeSelect").value = currentFontSize;
            document.documentElement.style.setProperty('--base-font-scale', currentFontSize);
        }
        if (settings.fontFamily) {
            currentFontFamily = settings.fontFamily;
            document.getElementById("fontFamilySelect").value = currentFontFamily;
            document.documentElement.style.setProperty('--app-font', currentFontFamily);
        }
        if (settings.isMuted !== undefined) {
            isMuted = settings.isMuted;
            updateSoundUI();
        }
    }
}

function goHome() {
    if (quizData.length > 0 && currentQuestion < quizData.length) {
        saveProgress();
    }
    document.getElementById("quizScreen").classList.add("hidden");
    document.getElementById("notesScreen").classList.add("hidden");
    document.getElementById("scoreScreen").classList.add("hidden");
    document.getElementById("detailedReviewScreen").classList.add("hidden");
    document.getElementById("startScreen").classList.remove("hidden");
    checkSavedProgress();
}

function saveProgress() {
    const state = {
        quizData,
        currentQuestion,
        score,
        streak,
        userAnswers,
        categoryStats,
        wrongQuestions,
        bookmarkedQuestions
    };
    localStorage.setItem("quizProgress", JSON.stringify(state));
}

function checkSavedProgress() {
    const saved = localStorage.getItem("quizProgress");
    if (saved) {
        document.getElementById("resumeBtn").classList.remove("hidden");
    } else {
        document.getElementById("resumeBtn").classList.add("hidden");
    }
}

function resumeQuiz() {
    const saved = localStorage.getItem("quizProgress");
    if (!saved) return;

    const state = JSON.parse(saved);
    quizData = state.quizData;
    currentQuestion = state.currentQuestion;
    score = state.score;
    streak = state.streak;
    userAnswers = state.userAnswers;
    categoryStats = state.categoryStats;
    wrongQuestions = state.wrongQuestions;
    bookmarkedQuestions = state.bookmarkedQuestions;

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("scoreScreen").classList.add("hidden");
    document.getElementById("notesScreen").classList.add("hidden");
    document.getElementById("detailedReviewScreen").classList.add("hidden");
    document.getElementById("quizScreen").classList.remove("hidden");

    updateStreakDisplay();
    loadQuestion();
}

function clearSavedProgress() {
    localStorage.removeItem("quizProgress");
    document.getElementById("resumeBtn").classList.add("hidden");
}

function restartQuiz() {
    clearSavedProgress();
    startQuiz(false);
}

function toggleBookmark() {
    let q = quizData[currentQuestion];
    if (q.type === "note") return; // Prevent bookmarking note screens
    
    const index = bookmarkedQuestions.findIndex(item => item.question === q.question);
    const btn = document.getElementById("bookmarkBtn");

    if (index > -1) {
        bookmarkedQuestions.splice(index, 1);
        btn.classList.remove("bookmarked");
        btn.textContent = "📍";
    } else {
        bookmarkedQuestions.push(q);
        btn.classList.add("bookmarked");
        btn.textContent = "📌";
    }
    saveProgress();
}

function updateBookmarkIcon() {
    let q = quizData[currentQuestion];
    const btn = document.getElementById("bookmarkBtn");
    
    if (q.type === "note") {
        btn.classList.add("hidden");
        return;
    } else {
        btn.classList.remove("hidden");
    }

    const isBookmarked = bookmarkedQuestions.some(item => item.question === q.question);
    
    if (isBookmarked) {
        btn.classList.add("bookmarked");
        btn.textContent = "📌";
    } else {
        btn.classList.remove("bookmarked");
        btn.textContent = "📍";
    }
}

function playSound(type) {
    if (isMuted) return;
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
    } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.setValueAtTime(110, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    }
}

function triggerConfetti() {
    if (typeof confetti === 'function') {
        confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 }
        });
    }
}

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

function startQuiz(randomize){
    clearSavedProgress();
    const selectedCategory = document.getElementById("categorySelect").value;

    let filteredQuestions = questions;

    if (selectedCategory !== "All") {
        filteredQuestions = questions.filter(q => q.category === selectedCategory);
    }

    if (filteredQuestions.length === 0) {
        alert("No questions found!");
        return;
    }

    quizData = JSON.parse(JSON.stringify(filteredQuestions));
    quizData.forEach(q => delete q.answered);

    if(randomize){
        shuffle(quizData);
    }

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("scoreScreen").classList.add("hidden");
    document.getElementById("detailedReviewScreen").classList.add("hidden");
    document.getElementById("quizScreen").classList.remove("hidden");

    currentQuestion = 0;
    score = 0;
    streak = 0;
    categoryStats = {};
    updateStreakDisplay();

    wrongQuestions = [];
    userAnswers = {};

    saveProgress();
    loadQuestion();
}

function updateStreakDisplay() {
    const badge = document.getElementById("streakBadge");
    if (streak >= 2) {
        badge.textContent = `🔥 ${streak} in a row!`;
        badge.classList.remove("hidden");
    } else {
        badge.classList.add("hidden");
    }
}

function updateProgressBar() {
    const totalQuizQuestions = quizData.filter(item => item.type !== "note").length;
    let completedQuizQuestions = 0;

    for (let i = 0; i <= currentQuestion; i++) {
        if (quizData[i].type !== "note" && (quizData[i].answered || userAnswers[i] !== undefined || i < currentQuestion)) {
            completedQuizQuestions++;
        }
    }

    const percentage = totalQuizQuestions > 0 ? Math.min(100, (completedQuizQuestions / totalQuizQuestions) * 100) : 0;
    document.getElementById("progressFill").style.width = `${percentage}%`;
}

function loadQuestion(){
    updateProgressBar();
    updateBookmarkIcon();

    document.getElementById("notesBtn").classList.add("hidden");
    document.getElementById("nextBtn").classList.add("hidden");
    
    if(currentQuestion > 0) {
        document.getElementById("prevBtn").classList.remove("hidden");
    } else {
        document.getElementById("prevBtn").classList.add("hidden");
    }

    let q = quizData[currentQuestion];
    let contentArea = document.getElementById("quizContentArea");

    if (q.type === "note") {
        let noteIndex = 0;
        let totalNotesCount = 0;
        for(let i = 0; i <= currentQuestion; i++) {
            if(quizData[i].type === "note") {
                if(i === currentQuestion) {
                    noteIndex = ++totalNotesCount;
                } else {
                    totalNotesCount++;
                }
            }
        }
        let totalRealNotes = quizData.filter(item => item.type === "note").length;

        document.getElementById("questionNumber").textContent = `Review Note (${noteIndex} of ${totalRealNotes})`;

        contentArea.innerHTML = `
            <div class="pure-note-card">
                <div class="pure-note-title">${q.question}</div>
                <div class="pure-note-content">${q.notes}</div>
            </div>
        `;

        document.getElementById("nextBtn").classList.remove("hidden");
        document.getElementById("nextBtn").textContent = currentQuestion === quizData.length - 1 ? "Finish Review ►" : "Next ►";

    } else {
        let quizIndex = 0;
        let totalQuizCount = 0;
        for(let i = 0; i <= currentQuestion; i++) {
            if(quizData[i].type !== "note") {
                if(i === currentQuestion) {
                    quizIndex = ++totalQuizCount;
                } else {
                    totalQuizCount++;
                }
            }
        }
        
        let totalRealQuizQuestions = quizData.filter(item => item.type !== "note").length;

        document.getElementById("questionNumber").textContent =
        `Question ${quizIndex} of ${totalRealQuizQuestions}`;

        contentArea.innerHTML = `
            <h2 id="questionText">${q.question}</h2>
            <div id="answers"></div>
        `;

        let answersDiv = document.getElementById("answers");

        q.answers.forEach(answer=>{
            let btn = document.createElement("button");
            btn.type = "button";
            btn.classList.add("answer");
            btn.textContent = answer;

            btn.onclick = function(){
                selectAnswer(answer, q);
            };

            answersDiv.appendChild(btn);
        });

        if(userAnswers[currentQuestion] !== undefined) {
            let savedAnswer = userAnswers[currentQuestion];
            highlightAnswers(savedAnswer, q, true);
        }
    }
}

function selectAnswer(selectedAnswer, q) {
    const isFirstTime = !q.answered;
    userAnswers[currentQuestion] = selectedAnswer;

    const cat = q.category || "General";
    if (!categoryStats[cat]) {
        categoryStats[cat] = { correct: 0, total: 0 };
    }

    if(selectedAnswer === q.correct){
        if(isFirstTime) {
            score++;
            q.answered = true;
            streak++;
            categoryStats[cat].correct++;
            categoryStats[cat].total++;
            playSound('correct');
        }
    } else {
        if(isFirstTime) {
            q.answered = true;
            streak = 0;
            categoryStats[cat].total++;
            playSound('wrong');
            if(!wrongQuestions.some(item => item.question === q.question)){
                wrongQuestions.push(q);
            }
        }
    }

    updateStreakDisplay();
    updateProgressBar();
    highlightAnswers(selectedAnswer, q, false);
    saveProgress();
}

function highlightAnswers(selectedAnswer, q, isReview) {
    let allButtons = document.querySelectorAll(".answer");

    allButtons.forEach(b => {
        b.disabled = true;

        if(b.textContent === q.correct) {
            if(selectedAnswer === q.correct) {
                b.classList.add("correct");
            } else {
                b.classList.add("correct-answer");
            }
        }
        
        if(b.textContent === selectedAnswer && selectedAnswer !== q.correct) {
            b.classList.add("wrong");
        }
    });

    currentNotes = q.notes;
    document.getElementById("notesBtn").classList.remove("hidden");
    document.getElementById("notesBtn").onclick = function(){
        showNotes();
    };

    let isLastQuestion = currentQuestion === quizData.length - 1;

    document.getElementById("nextBtn").classList.remove("hidden");
    document.getElementById("nextBtn").textContent = isLastQuestion ? "Finish Quiz ►" : "Next Question ►";
}

function prevQuestion() {
    if(currentQuestion > 0) {
        currentQuestion--;
        saveProgress();
        loadQuestion();
    }
}

function showNotes(){
    document.getElementById("quizScreen").classList.add("hidden");
    document.getElementById("notesScreen").classList.remove("hidden");
    document.getElementById("notesBox").textContent = currentNotes;
}

function backToQuestion(){
    document.getElementById("notesScreen").classList.add("hidden");
    document.getElementById("quizScreen").classList.remove("hidden");
}

document.getElementById("nextBtn").onclick = function(){
    currentQuestion++;
    saveProgress();
    if(currentQuestion < quizData.length){
        loadQuestion();
    }else{
        showScore();
    }
};

function showScore(){
    clearSavedProgress(); 
    
    document.getElementById("quizScreen").classList.add("hidden");
    document.getElementById("scoreScreen").classList.remove("hidden");

    const totalQuizQuestions = quizData.filter(q => q.type !== "note").length;
    const totalNotesCount = quizData.filter(q => q.type === "note").length;
    const retakeBtn = document.getElementById("retakeAllBtn");

    if (totalQuizQuestions === 0) {
        document.getElementById("scoreHeaderTitle").textContent = "Notes Review Finished!";
        document.getElementById("scoreText").innerHTML = `You have successfully completed reviewing the notes!`;
        
        document.getElementById("analyticsCard").classList.add("hidden");
        document.getElementById("reviewAllAnswersBtn").classList.add("hidden");
        
        if (totalNotesCount > 0) {
            document.getElementById("reviewAllNotesBtn").classList.remove("hidden");
        } else {
            document.getElementById("reviewAllNotesBtn").classList.add("hidden");
        }

        document.getElementById("retakeWrongBtn").classList.add("hidden");
        document.getElementById("reviewBookmarkedBtn").classList.add("hidden");
        
        retakeBtn.textContent = "Re-read All Notes";
        retakeBtn.classList.remove("hidden");
        return;
    }

    document.getElementById("scoreHeaderTitle").textContent = "Quiz Finished!";
    document.getElementById("analyticsCard").classList.remove("hidden");
    document.getElementById("reviewAllAnswersBtn").classList.remove("hidden");
    
    if (totalNotesCount > 0) {
        document.getElementById("reviewAllNotesBtn").classList.remove("hidden");
    } else {
        document.getElementById("reviewAllNotesBtn").classList.add("hidden");
    }

    retakeBtn.textContent = "Retake All Questions";

    const percentage = (score / totalQuizQuestions) * 100;

    if(wrongQuestions.length === 0){
        document.getElementById("scoreText").innerHTML =
        `Perfect Score!<br>${score} / ${totalQuizQuestions}`;
        playSound('correct');
        triggerConfetti();
    } else {
        document.getElementById("scoreText").textContent =
        `Your Score: ${score} / ${totalQuizQuestions}`;
        if (percentage >= 70) {
            triggerConfetti();
        }
    }

    const analyticsList = document.getElementById("analyticsList");
    analyticsList.innerHTML = "";
    for (let cat in categoryStats) {
        let stat = categoryStats[cat];
        let pct = Math.round((stat.correct / stat.total) * 100);
        let status = pct >= 70 ? "🟢" : "🔴";
        
        let div = document.createElement("div");
        div.className = "analytics-item";
        div.innerHTML = `<span><strong>${cat}:</strong> ${stat.correct}/${stat.total}</span> <span>${pct}% ${status}</span>`;
        analyticsList.appendChild(div);
    }

    if(wrongQuestions.length > 0){
        document.getElementById("retakeWrongBtn").classList.remove("hidden");
    } else {
        document.getElementById("retakeWrongBtn").classList.add("hidden");
    }

    if(bookmarkedQuestions.length > 0){
        document.getElementById("reviewBookmarkedBtn").classList.remove("hidden");
    } else {
        document.getElementById("reviewBookmarkedBtn").classList.add("hidden");
    }
}

function showDetailedReview(mode) {
    currentReviewMode = mode || 'answers';
    document.getElementById("scoreScreen").classList.add("hidden");
    document.getElementById("detailedReviewScreen").classList.remove("hidden");

    const titleEl = document.getElementById("detailedReviewTitle");
    const subtitleEl = document.getElementById("detailedReviewSubtitle");

    if (currentReviewMode === 'notes') {
        titleEl.textContent = "All Notes & Explanations";
        subtitleEl.textContent = "Review all the stand-alone notes and key takeaways:";
    } else {
        titleEl.textContent = "Detailed Review";
        subtitleEl.textContent = "Review your answers and detailed notes for each question:";
    }

    const filterSelect = document.getElementById("reviewCategoryFilter");
    
    let availableCategories = quizData;
    if (currentReviewMode === 'notes') {
        availableCategories = quizData.filter(q => q.type === "note");
    }
    
    const categories = ["All", ...new Set(availableCategories.map(q => q.category).filter(Boolean))];
    
    filterSelect.innerHTML = "";
    categories.forEach(cat => {
        let opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat === "All" ? "All Categories" : cat;
        filterSelect.appendChild(opt);
    });

    renderDetailedReviewCards();
}

function renderDetailedReviewCards() {
    const container = document.getElementById("detailedReviewContainer");
    container.innerHTML = "";

    const selectedCategory = document.getElementById("reviewCategoryFilter").value;
    let reviewItemCount = 0;

    quizData.forEach((q, index) => {
        if (selectedCategory !== "All" && q.category !== selectedCategory) {
            return;
        }

        if (currentReviewMode === 'notes') {
            if (q.type !== "note") return;
            reviewItemCount++;
            const card = document.createElement("div");
            card.className = "review-card";
            card.innerHTML = `
                <div class="review-card-header">
                    <span style="font-weight: 700; color: #38bdf8;">Note #${reviewItemCount}</span>
                </div>
                <div class="review-q-text">${q.question}</div>
                <div class="review-notes" style="border-left-color: #38bdf8; margin-top: 0;">${q.notes}</div>
            `;
            container.appendChild(card);
        } else {
            if (q.type === "note") return;

            reviewItemCount++;
            const userAns = userAnswers[index];
            const isCorrect = userAns === q.correct;
            const statusBadge = isCorrect ? "🟢 Correct" : "🔴 Incorrect";
            
            const card = document.createElement("div");
            card.className = "review-card";
            card.innerHTML = `
                <div class="review-card-header">
                    <span style="font-weight: 700;">Q${reviewItemCount}</span>
                    <span>${statusBadge}</span>
                </div>
                <div class="review-q-text">${q.question}</div>
                <div class="review-ans-row" style="color: ${isCorrect ? '#4ade80' : '#f87171'};">
                    <strong>Your Answer:</strong> ${userAns || "No answer"}
                </div>
                ${!isCorrect ? `<div class="review-ans-row" style="color: #4ade80;"><strong>Correct Answer:</strong> ${q.correct}</div>` : ''}
                ${q.notes ? `<div class="review-notes"><strong>Notes:</strong> ${q.notes}</div>` : ''}
            `;
            container.appendChild(card);
        }
    });
}

function backToScoreScreen() {
    document.getElementById("detailedReviewScreen").classList.add("hidden");
    document.getElementById("scoreScreen").classList.remove("hidden");
}

function retakeWrongQuestions(){
    clearSavedProgress();
    quizData = JSON.parse(JSON.stringify(wrongQuestions));
    quizData.forEach(q => delete q.answered);

    wrongQuestions = [];
    userAnswers = {};
    categoryStats = {};
    currentQuestion = 0;
    score = 0;
    streak = 0;
    updateStreakDisplay();

    document.getElementById("scoreScreen").classList.add("hidden");
    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("quizScreen").classList.remove("hidden");
    
    saveProgress();
    loadQuestion();
}

function reviewBookmarkedQuestions(){
    clearSavedProgress();
    quizData = JSON.parse(JSON.stringify(bookmarkedQuestions));
    quizData.forEach(q => delete q.answered);

    wrongQuestions = [];
    userAnswers = {};
    categoryStats = {};
    currentQuestion = 0;
    score = 0;
    streak = 0;
    updateStreakDisplay();

    document.getElementById("scoreScreen").classList.add("hidden");
    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("quizScreen").classList.remove("hidden");
    
    saveProgress();
    loadQuestion();
}

</script>

</body>
</html>
